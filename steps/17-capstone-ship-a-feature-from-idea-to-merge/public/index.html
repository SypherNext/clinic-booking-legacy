<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harbor Street Clinic: Book an appointment</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">Harbor Street Clinic</div>
      <div class="tag">Appointment booking</div>
      <a href="/desk.html">Front desk</a>
    </header>

    <main>
      <section class="card">
        <h1>Book an appointment</h1>
        <div class="row">
          <label>Doctor
            <select id="doctor"></select>
          </label>
          <label>Date
            <input id="date" type="date" />
          </label>
          <button type="button" id="next-free" class="ghost">Next free time</button>
        </div>

        <h2>Free times <span id="day-label" class="muted"></span></h2>
        <p id="move-bar" hidden>
          <span id="move-text"></span>
          <button type="button" id="stop-moving" class="small ghost">Stop moving</button>
        </p>
        <div id="slots" class="slots"></div>

        <form id="book-form" class="book" hidden>
          <p>Booking <strong id="chosen"></strong></p>
          <div class="row">
            <label>Patient name
              <input id="patient-name" autocomplete="off" />
            </label>
            <label>Phone (optional)
              <input id="patient-phone" autocomplete="off" />
            </label>
          </div>
          <button type="submit">Book this time</button>
          <button type="button" id="cancel-choice" class="ghost">Choose another time</button>
        </form>
        <p id="message" class="message" role="status"></p>
      </section>

      <section class="card">
        <h2>Appointments that day</h2>
        <table class="list">
          <thead>
            <tr><th>Time</th><th>Patient</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="appointments"></tbody>
        </table>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
